# Local development database. Tests don't use this: they run against mongodb-memory-server.
name: callsign

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    # A one-node replica set: MongoDB only runs transactions on a replica set.
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Also initiates the replica set on first start (or on a volume from before it was one), and
      # passes only once the node is primary (accepts writes).
      # The member is `localhost:27017`, so clients on the host reach it through the port mapping.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) } quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongo-data:

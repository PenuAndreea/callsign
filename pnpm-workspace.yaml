packages:
  - 'apps/*'
  - 'packages/*'

# Packages allowed to run install scripts. Only allow what really needs a native build.
# The ones below ship prebuilt binaries as optional deps; their scripts are only fallbacks/checks.
allowBuilds:
  '@parcel/watcher': false # Jest 30
  argon2: true # native addon (falls back to a node-gyp build when no prebuild fits)
  esbuild: false # tsup
  msw: false # postinstall only copies the browser worker; the hooks tests use msw/node
  unrs-resolver: false # Jest 30
  mongodb-memory-server: false # postinstall only pre-downloads mongod; it downloads on first use instead (cached in CI)

# Pinned to what the Expo SDK expects. Bump only together with an Expo SDK upgrade.
catalog:
  react: 19.2.3
  react-dom: 19.2.3
  react-test-renderer: 19.2.3
  react-native-web: ~0.21.0
  react-native-svg: 15.15.5
  '@types/react': ~19.2.2
  '@types/react-dom': ~19.2.3
  # Not tied to Expo: one version for the shared schemas and every package that imports zod.
  zod: ^4.6.7

# Security patches for transitive dependencies whose parents still allow the vulnerable version
# (`pnpm audit`). Same major only, so nothing breaks; remove an entry once its parent catches up.
overrides:
  body-parser: ^2.4.0 # express 5.3 allows 2.3 (DoS, GHSA high)
  node-forge: ^1.4.1 # @expo/cli allows 1.3 (certificate checks, GHSA high)

# Expo/Metro needs a flat node_modules in a pnpm monorepo
nodeLinker: hoisted

# Accepted audit findings (see docs/security.md, A03). No same-major fix exists; revisit with the
# next Expo SDK upgrade.
auditConfig:
  ignoreGhsas:
    # zod 3 inside @expo/cli: dev and build tooling only, never in the app bundle or the API.
    - GHSA-mrhx-c7xc-m3w5
    # decode-uri-component 0.2 in expo-router's query-string: parses the app's own deep links;
    # the worst case is a slow parse on the user's own device. The fix is a breaking major.
    - GHSA-qr28-fpjm-wq7f

version: 2

updates:
  # pnpm workspace (Dependabot reads pnpm-lock.yaml through the npm ecosystem).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One PR for all minor and patch updates instead of one per package.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned to the Expo SDK: bump only together with an SDK upgrade (pnpm-workspace.yaml catalog).
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@types/react'
      - dependency-name: '@types/react-dom'
      - dependency-name: 'react-test-renderer'

  # Keeps the SHA-pinned actions in .github/workflows and .github/actions current.
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
